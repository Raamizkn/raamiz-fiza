<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raamiz &amp; Fiza · Invitations</title>
<meta name="description" content="Barat · Friday, 18 December 2026 · 3 to 6 PM · Lahore — Walima · Sunday, 20 December 2026 · 1 to 4 PM · Islamabad">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#e6e3db">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Raamiz &amp; Fiza">
<meta property="og:title" content="Raamiz &amp; Fiza · Wedding invitations">
<meta property="og:description" content="Barat · Friday, 18 December 2026 · 3 to 6 PM · Lahore — Walima · Sunday, 20 December 2026 · 1 to 4 PM · Islamabad">
<meta property="og:url" content="https://raamizkn.github.io/raamiz-fiza/">
<meta property="og:image" content="https://raamizkn.github.io/raamiz-fiza/assets/og-barat.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/icon-barat.png">
<link rel="apple-touch-icon" href="assets/touch-barat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Pinyon+Script&amp;display=swap">
<style>
  :root {
    --bg: #e6e3db;
    --ink: #765a31;
    --ink-soft: rgba(118, 90, 49, .86);
    --line: rgba(118, 90, 49, .28);
    --panel: rgba(255, 255, 255, .42);
    --serif: "Cormorant Garamond", Georgia, serif;
    --script: "Pinyon Script", "Snell Roundhand", cursive;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    background: radial-gradient(90% 50% at 50% 0%, #f4f1ea 0%, transparent 70%), var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-variant-numeric: lining-nums;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    width: min(100%, 520px);
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 44px) 18px calc(env(safe-area-inset-bottom, 0px) + 40px);
    text-align: center;
  }
  .bismillah {
    width: 168px;
    aspect-ratio: 315 / 105;
    margin: 0 auto;
    background: var(--ink);
    -webkit-mask: url(assets/bismillah.png) center / contain no-repeat;
    mask: url(assets/bismillah.png) center / contain no-repeat;
  }
  h1 {
    margin: 18px 0 0;
    font-family: var(--script);
    font-weight: 400;
    font-size: 52px;
    line-height: 1.15;
  }
  .kicker {
    margin: 6px 0 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .34em;
    padding-left: .34em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .events {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 34px;
  }
  .event {
    display: block;
    color: inherit;
    text-decoration: none;
  }
  .event img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1419 / 2000;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 2px 5px rgba(40, 26, 10, .12), 0 14px 26px -12px rgba(40, 26, 10, .4);
    transition: transform .2s ease;
  }
  .event:active img { transform: scale(.98); }
  .event h2 {
    margin: 14px 0 0;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
  }
  .event p {
    margin: 4px 0 0;
    font-size: 15px;
    line-height: 1.35;
    color: var(--ink-soft);
  }
  .share {
    margin-top: 40px;
    padding: 22px 18px 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    text-align: left;
  }
  .share h3 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .3em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink-soft);
  }
  label {
    display: block;
    margin-top: 18px;
    font-size: 15px;
    font-weight: 600;
  }
  input {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, .7);
    color: var(--ink);
    font: 500 18px/1.2 var(--serif);
    outline: none;
  }
  input:focus { border-color: var(--ink-soft); }
  .hint { margin: 6px 0 0; font-size: 14px; font-style: italic; color: var(--ink-soft); }
  .link-row { margin-top: 18px; }
  .link-row strong {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .24em;
    text-transform: uppercase;
  }
  .link-row code {
    display: block;
    margin-top: 6px;
    padding: 9px 11px;
    border-radius: 8px;
    background: rgba(255, 255, 255, .55);
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: #5b4526;
    word-break: break-all;
  }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  button {
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .6);
    color: var(--ink);
    font: 700 12px/1 var(--serif);
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button.wa { background: #1f7a4d; border-color: #1f7a4d; color: #fff; }
  button:active { transform: scale(.98); }
  footer { margin-top: 30px; font-size: 14px; font-style: italic; color: var(--ink-soft); }
</style>
</head>
<body>
<main>
  <div class="bismillah" role="img" aria-label="Bismillah ir-Rahman ir-Rahim"></div>
  <h1>Raamiz &amp; Fiza</h1>
  <p class="kicker">Wedding invitations</p>

  <div class="events">
    <a class="event" href="barat/">
      <img src="assets/card-barat.webp?v=2" width="1276" height="1896" alt="Barat invitation card">
      <h2>Barat</h2>
      <p>Friday, 18 December · 3–6&nbsp;PM<br>Palm Hills Country Club, Lahore</p>
    </a>
    <a class="event" href="walima/">
      <img src="assets/card-walima.webp?v=2" width="1419" height="2000" alt="Walima invitation card">
      <h2>Walima</h2>
      <p>Sunday, 20 December · 1–4&nbsp;PM<br>Montage Event Complex, Islamabad</p>
    </a>
  </div>

  <section class="share" aria-labelledby="share-title">
    <h3 id="share-title">Send an invitation</h3>
    <label for="guest">Guest name <span style="font-weight:500">(optional)</span></label>
    <input id="guest" type="text" autocomplete="off" placeholder="e.g. Khan Family" maxlength="48">
    <p class="hint">Shown on the envelope as “Dear …,”.</p>

    <div class="link-row" data-event="barat" data-title="Barat" data-when="Friday, 18 December 2026, 3 to 6 PM at Palm Hills Country Club, Lahore" data-maps="Palm Hills Country Club, Barki Road, Lahore">
      <strong>Barat link</strong>
      <code></code>
      <div class="buttons"><button type="button" data-copy>Copy link</button><button type="button" class="wa" data-wa>WhatsApp</button></div>
    </div>
    <div class="link-row" data-event="walima" data-title="Walima" data-when="Sunday, 20 December 2026, 1 to 4 PM at Montage Event Complex, Islamabad" data-maps="Montage Event Complex, Main Gulberg Expressway, Islamabad">
      <strong>Walima link</strong>
      <code></code>
      <div class="buttons"><button type="button" data-copy>Copy link</button><button type="button" class="wa" data-wa>WhatsApp</button></div>
    </div>
  </section>

  <footer>With love &amp; duas</footer>
</main>

<script>
  (() => {
    const input = document.getElementById('guest');
    const rows = [...document.querySelectorAll('.link-row')];

    const linkFor = (row) => {
      const url = new URL(`${row.dataset.event}/`, location.href);
      url.search = '';
      url.hash = '';
      const name = input.value.replace(/\s+/g, ' ').trim();
      if (name) url.searchParams.set('to', name);
      return url.toString();
    };

    const message = (row) => {
      const name = input.value.replace(/\s+/g, ' ').trim();
      const greeting = name ? `Assalam-o-Alaikum ${name}!` : 'Assalam-o-Alaikum!';
      const location = `https://maps.google.com/?q=${encodeURIComponent(row.dataset.maps).replace(/%20/g, '+')}`;
      return `${greeting} You are cordially invited to the ${row.dataset.title} of Raamiz & Fiza on ${row.dataset.when}. 💌\n\nOpen your invitation: ${linkFor(row)}\n\n📍 Location: ${location}`;
    };

    const refresh = () => rows.forEach((row) => { row.querySelector('code').textContent = linkFor(row); });

    const copy = async (text) => {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const ta = Object.assign(document.createElement('textarea'), { value: text });
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      }
    };

    rows.forEach((row) => {
      const copyBtn = row.querySelector('[data-copy]');
      copyBtn.addEventListener('click', async () => {
        const ok = await copy(linkFor(row));
        copyBtn.textContent = ok ? 'Copied ✓' : 'Press & hold link';
        setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1600);
      });
      row.querySelector('[data-wa]').addEventListener('click', () => {
        window.open(`https://wa.me/?text=${encodeURIComponent(message(row))}`, '_blank', 'noopener');
      });
    });

    input.addEventListener('input', refresh);
    refresh();
  })();
</script>
</body>
</html>
